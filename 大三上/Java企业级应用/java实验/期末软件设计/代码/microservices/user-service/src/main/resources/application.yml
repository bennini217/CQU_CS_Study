server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "000000"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

# MyBatis Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.student.common.entity

# 密码加密模式配置
app:
  password:
    encrypt-mode: demo  # demo: 演示模式，明文存储；production: 生产模式，BCrypt加密

# Knife4j配置
knife4j:
  enable: true
  openapi:
    title: 用户认证服务 API文档
    description: 学生成绩管理系统 - 用户认证服务
    version: 1.0.0




