server:
  port: 8888  # 改为8888端口，避免与8080端口冲突

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      discovery:
        locator:
          enabled: true  # 启用服务发现
          lower-case-service-id: true  # 使用小写服务名
      routes:
        # 用户认证服务路由 - 登录
        - id: user-service-login
          uri: lb://user-service
          predicates:
            - Path=/api/login
          filters:
            - StripPrefix=0
        
        # 用户认证服务路由 - 修改密码
        - id: user-service-change-password
          uri: lb://user-service
          predicates:
            - Path=/api/change-password
          filters:
            - StripPrefix=0
        
        # 学生服务路由
        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/api/student/**
          filters:
            - StripPrefix=0
        
        # 成绩服务路由
        - id: grade-service
          uri: lb://grade-service
          predicates:
            - Path=/api/grade/**
          filters:
            - StripPrefix=0
        
        # 仪表盘路由
        - id: dashboard-service
          uri: lb://grade-service
          predicates:
            - Path=/api/dashboard/**
          filters:
            - StripPrefix=0
        
        # 教师服务路由
        - id: teacher-service
          uri: lb://teacher-service
          predicates:
            - Path=/api/teacher/**
          filters:
            - StripPrefix=0
        
        # AI服务路由
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0

# 跨域配置（Gateway方式）
# 注意：Gateway使用WebFlux，需要通过代码配置CORS
# 见CorsConfig.java



